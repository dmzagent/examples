# The GitOps wheel for the examples' Solution Manifests.
#
# On a pull request that touches a manifest: validate it and post the Change
# Set as a comment (the pre-change impact review). When the pull request is
# merged: apply, with the PR author as the maker and the merger as the checker,
# both authenticated GitHub logins. The platform refuses when they are the same
# principal, so branch protection (a required review, no self-approval) is what
# makes the four-eyes control sound.
#
# Needs two repository secrets: DMZAGENT_API_KEY (a tenant_admin key for the
# workspace the manifests adopt) and, if not the public endpoint,
# DMZAGENT_BASE_URL. Without the key the jobs skip rather than fail, so forks
# and the tests workflow are unaffected.
name: governance

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths: ["*/solution.yaml"]

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the command line
        run: python -m pip install ./cli
      - name: Which manifests changed
        id: changed
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD -- '*/solution.yaml' | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"
      - name: Validate and plan each changed manifest
        if: env.DMZAGENT_API_KEY != '' && steps.changed.outputs.files != ''
        env:
          DMZAGENT_API_KEY: ${{ secrets.DMZAGENT_API_KEY }}
          DMZAGENT_BASE_URL: ${{ secrets.DMZAGENT_BASE_URL }}
        run: |
          : > plan.md
          for f in ${{ steps.changed.outputs.files }}; do
            echo "## $f" >> plan.md
            dmz --color never validate "$f" | tee -a plan.md
            dmz --color never plan "$f" --markdown | tee -a plan.md
            echo >> plan.md
          done
      - name: Post the Change Set on the pull request
        if: env.DMZAGENT_API_KEY != '' && steps.changed.outputs.files != ''
        env:
          DMZAGENT_API_KEY: ${{ secrets.DMZAGENT_API_KEY }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('plan.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });

  apply:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the command line
        run: python -m pip install ./cli
      - name: Which manifests changed
        id: changed
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD -- '*/solution.yaml' | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"
      - name: Apply on merge (maker = author, checker = merger)
        if: env.DMZAGENT_API_KEY != '' && steps.changed.outputs.files != ''
        env:
          DMZAGENT_API_KEY: ${{ secrets.DMZAGENT_API_KEY }}
          DMZAGENT_BASE_URL: ${{ secrets.DMZAGENT_BASE_URL }}
          APPLIED_BY: ${{ github.event.pull_request.user.login }}
          APPROVED_BY: ${{ github.event.pull_request.merged_by.login }}
        run: |
          for f in ${{ steps.changed.outputs.files }}; do
            dmz --color never apply "$f" --yes --applied-by "$APPLIED_BY" --approved-by "$APPROVED_BY"
          done
