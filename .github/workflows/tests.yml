name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  giaas:
    name: giaas toolkit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run the toolkit tests
        run: python -m unittest discover -s giaas/tests -v
        env:
          PYTHONPATH: giaas

  examples:
    name: ${{ matrix.example }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - 01-hosted-chatbot
          - 02-platform-agent
          - 03-ollama-chatbot
          - 04-review-desk
          - 05-sensor-fleet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the pinned SDK
        if: hashFiles(format('{0}/requirements.txt', matrix.example)) != ''
        run: python -m pip install -r "${{ matrix.example }}/requirements.txt"
      - name: Run the example's tests
        working-directory: ${{ matrix.example }}
        run: python -m unittest discover -s tests -v
