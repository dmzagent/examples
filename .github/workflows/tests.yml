name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli:
    name: dmz cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the official MCP SDK (the bridge test that uses it skips when this fails)
        run: python -m pip install mcp
        continue-on-error: true
      - name: Run the CLI and bridge tests
        run: python -m unittest discover -s cli/tests -v
        env:
          PYTHONPATH: cli
      - name: Install the CLI and check the entry point
        run: |
          python -m pip install ./cli
          dmz --version
          dmz init --list

  examples:
    name: ${{ matrix.example }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - 01-hosted-chatbot
          - 02-platform-agent
          - 03-ollama-chatbot
          - 04-review-desk
          - 05-sensor-fleet
          - 06-mcp-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the pinned SDK
        if: hashFiles(format('{0}/requirements.txt', matrix.example)) != ''
        run: python -m pip install -r "${{ matrix.example }}/requirements.txt"
      - name: Run the example's tests
        working-directory: ${{ matrix.example }}
        run: python -m unittest discover -s tests -v
